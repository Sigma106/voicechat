<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efeee8">
  <meta name="description" content="One link. One room. Everyone on the same line.">
  <title>openline — start talking</title>
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./turn-config.js?v=1"></script>
  <script type="module" src="./app.js?v=5"></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a href="./" class="logo" aria-label="openline home"><span class="logo-symbol" aria-hidden="true">↗</span>openline<span class="logo-stop">.</span></a>
      <div class="masthead-note"><span class="beacon" aria-hidden="true"></span> PUBLIC ROOM <span class="masthead-divider">/</span> 001</div>
    </header>

    <main class="content">
      <section id="landing" class="landing" aria-label="Join voice chat">
        <div class="landing-art" aria-hidden="true">
          <span class="landing-art__one">O</span><span class="landing-art__two">L</span><span class="landing-art__slash">/</span>
        </div>
        <button type="button" id="start" class="start-button">
          <span class="start-button__icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M16 4v24M9 10v12M23 10v12M2 14v4M30 14v4" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"/></svg>
          </span>
          <span class="start-button__text" id="start-label">START VOICE CHAT</span>
          <span class="start-button__arrow" aria-hidden="true">↗</span>
        </button>
        <p id="error" class="error" role="alert" hidden></p>
        <p class="landing-note">NO ACCOUNT. NO ROOM CODES. JUST TALK.</p>
      </section>

      <section id="call" class="room" aria-label="Live voice room" hidden>
        <div class="room-heading">
          <span class="room-kicker"><span class="beacon beacon--on" aria-hidden="true"></span> ON THE LINE <span class="room-id">/ ROOM 001</span></span>
          <h1 id="heading" aria-live="polite">Waiting for voices.</h1>
          <p class="room-description" id="description">Send this link to someone. They'll join the same room.</p>
        </div>

        <div class="audio-board">
          <div class="audio-board__top"><span>YOUR MICROPHONE</span><span id="mic-status">MIC READY</span></div>
          <div class="meter" role="presentation"><div class="meter__grid"></div><div class="meter__fill" id="mic-level"></div><span class="meter__zero">0</span><span class="meter__max">100</span></div>
          <div class="audio-board__bottom"><span id="connection-status" aria-live="polite">Waiting for someone else</span><span id="people">01 ON THE LINE</span></div>
        </div>

        <div class="controls" aria-label="Call controls">
          <button type="button" id="mute" class="control control--primary" aria-pressed="false">
            <span id="mute-symbol" class="control-icon" aria-hidden="true">◖))</span><span id="mute-label">MUTE MIC</span>
          </button>
          <button type="button" id="invite" class="control"><span class="control-icon" aria-hidden="true">↗</span><span id="invite-label">COPY LINK</span></button>
          <button type="button" id="leave" class="control control--leave"><span class="control-icon" aria-hidden="true">×</span><span>LEAVE</span></button>
        </div>
        <p id="notice" class="notice" role="status" aria-live="polite"></p>
        <div class="assistance">
          <button type="button" id="enable-sound" class="text-button" hidden>Enable speaker audio ↗</button>
          <button type="button" id="retry" class="text-button" hidden>Retry connection ↗</button>
          <button type="button" id="diagnostics" class="text-button" hidden>Copy connection report ↗</button>
        </div>
      </section>
    </main>

    <footer class="footer"><span>VOICE, NOT VIDEO</span><span>A SMALL PLACE ON THE INTERNET <span class="footer-star">✳</span></span></footer>
  </div>
  <div id="audio-container" aria-hidden="true"></div>
</body>
</html>
